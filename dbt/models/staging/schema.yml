version: 2

models:
  - name: stg_questions
    columns:
      - name: question_id
        tests: [not_null, unique]
      - name: category
        tests: [not_null]
      - name: difficulty
        tests: [not_null]

  - name: stg_answers
    columns:
      - name: question_id
        tests: [not_null]
      - name: prompt_variant
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: ai_correct
        tests: [not_null]
      - name: response_time
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [question_id, prompt_variant, model]
